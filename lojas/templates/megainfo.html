<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>MegaInfo Distribuidora</title>
<style>
  body { font-family: Helvetica, Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
  header { padding: 18px 32px; font-size: 24px; font-weight: bold; color: #38bdf8; }
  .vitrine { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 0 32px; }
  .card { background: #1e293b; border-radius: 10px; padding: 16px; }
  .card h3 { font-size: 16px; min-height: 40px; }
  .sku, .ean { display: block; font-size: 12px; color: #94a3b8; }
  .valor { display: block; font-size: 22px; color: #4ade80; margin-top: 10px; }
  .esgotado { display: block; font-size: 16px; color: #f87171; margin-top: 10px; }
  nav { padding: 24px 32px; }
  nav a { color: #38bdf8; font-size: 18px; }
</style>
</head>
<body>
<header>MegaInfo Distribuidora</header>
<section class="vitrine">
  {% for p in produtos %}
  <div class="card">
    <h3>{{ p.descricao }}</h3>
    <span class="sku">SKU {{ p.codigo }}</span>
    <span class="ean">EAN: {{ p.ean }}</span>
    {% if p.disponivel %}
    <span class="valor">R$ {{ p.preco | reais }}</span>
    {% else %}
    <span class="esgotado">Sem estoque</span>
    {% endif %}
  </div>
  {% endfor %}
</section>
<nav>
  Página {{ pagina }}
  {% if tem_proxima %} · <a id="proxima" href="/megainfo?pagina={{ pagina + 1 }}">Próxima página →</a>{% endif %}
</nav>
</body>
</html>
