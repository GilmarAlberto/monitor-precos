<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Atacadão do Escritório</title>
<style>
  body { font-family: Verdana, sans-serif; margin: 0; background: #fff8e7; color: #333; }
  header { background: #c0392b; color: #fff; padding: 16px 32px; font-size: 22px; font-weight: bold; }
  main { max-width: 960px; margin: 24px auto; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th { background: #f4d03f; text-align: left; padding: 10px; }
  td { padding: 10px; border-bottom: 1px solid #eee; }
  .preco { font-weight: bold; color: #c0392b; }
  .sem-estoque { color: #999; }
</style>
</head>
<body>
<header>Atacadão do Escritório · Tabela de preços</header>
<main>
<table id="tabela-precos">
  <tr><th>Código</th><th>EAN</th><th>Descrição</th><th>Preço</th><th>Estoque</th></tr>
  {% for p in produtos %}
  <tr class="produto">
    <td class="codigo">{{ p.codigo }}</td>
    <td class="ean">{{ p.ean }}</td>
    <td class="descricao">{{ p.descricao }}</td>
    <td class="preco">R$ {{ p.preco | reais }}</td>
    <td class="estoque {{ '' if p.disponivel else 'sem-estoque' }}">{{ 'Disponível' if p.disponivel else 'Indisponível' }}</td>
  </tr>
  {% endfor %}
</table>
</main>
</body>
</html>
